<!DOCTYPE html>

<head>

  <title>Takdir Zodiak Cina | Shio</title>

  <style>
    :root {
      --blue-dark: #060b1f;
      --blue-panel: rgba(10, 20, 55, 0.78);
      --gold: #d4b36a;
      --border: rgba(200, 210, 255, 0.25);
      --text: #eef2ff;
    }

    * {
      box-sizing: border-box;
      font-family: "Georgia", "Times New Roman", serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: 
        linear-gradient(rgba(6,11,31,0.6), rgba(6,11,31,0.6)), /* 半透明叠加，保证文字可读 */
        url("images/cloud.jpg") no-repeat center center;
      background-size: cover;  /* 拉伸填充整个页面 */
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }


    .layout {
      width: 100%;
      max-width: 960px;
      display: flex;
      gap: 24px;
    }

    .main {
      flex: 2;
    }

    .history {
      flex: 1;
      background: var(--blue-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .panel {
      background: var(--blue-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      color: #cfd6ff;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #b4933d, #f1d58a);
      color: #000;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .card {
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .zodiac-name {
      text-align: center;
      font-size: 22px;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .zodiac-keywords {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--gold);
      text-align: center;
    }

    .zodiac-image {
      width: 100%;         /* 占满卡片宽度 */
      height: auto;        /* 高度随图片比例自动调整 */
      overflow: hidden;    /* 防止超出 */
      position: relative;  /* 保留保存按钮定位 */
      border-radius: 0;    /* 去掉圆角 */
      padding: 0;          /* 去掉内边距 */
      background: none;    /* 去掉背景光晕 */
      box-shadow: none;    /* 去掉阴影 */
    }

    .zodiac-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .save-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(212, 179, 106, 0.8); /* 半透明金色 */
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .save-btn:hover {
      transform: scale(1.15);
      background: rgba(212, 179, 106, 1);
    }


    .zodiac-desc {
      font-size: 14px;
      line-height: 1.8;
      text-align: justify;
    }

    .history h3 {
      margin: 0 0 12px;
      font-size: 16px;
      text-align: center;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .history ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history li {
      padding: 8px;
      border-bottom: 1px dashed rgba(255,255,255,0.15);
      font-size: 14px;
    }
    .clear-btn {
      float: right;
      font-size: 12px;

      border-radius: 6px;

      font-size: 12px;
      text-align: center;
      color: #aab2ff;
    }

    @media (max-width: 768px) {
      .layout {

      }
    }
  </style>
</head>

     * @returns {number} Tahun lunar Cina

    function getLunarYear(date) {
      const year = date.getFullYear();
      const approxLunarNewYear = new Date(year, 1, 4);

    function calculateZodiac() {
      const name = document.getElementById("userName").value.trim();
      const input = document.getElementById("birthDate").value.trim();

      if (!name) { alert("Silakan masukkan nama Anda"); return; }
      if (!/^\d{8}$/.test(input)) { alert("Silakan masukkan tanggal sebagai 8 digit: YYYYMMDD"); return; }

      const year = parseInt(input.slice(0,4),10);
      const month = parseInt(input.slice(4,6),10) - 1; 
      const day = parseInt(input.slice(6,8),10);

      const date = new Date(year, month, day);
      if (isNaN(date)) { alert("Tanggal tidak valid"); return; }

      const lunarYear = getLunarYear(date);
      const index = (lunarYear - 4) % 12;
      const zodiac = zodiacs[index];

      document.getElementById("result").innerHTML = `
        <div class="panel card">
          <div class="zodiac-name">${name} - ${zodiac.name}</div>
          <div class="zodiac-image">
            <img src="${zodiac.image}" alt="${zodiac.name}" />
            <button class="save-btn" onclick="saveImage('${zodiac.image}', '${name}-${zodiac.name}.jpg')">💾</button>
          </div>
          <div class="zodiac-keywords">${zodiac.keywords}</div>
          <div class="zodiac-desc">${zodiac.desc}</div>
        </div>
      `;

      saveHistory(name, zodiac.name);
    }

    /**
     * Fungsi untuk menyimpan hasil pencarian ke localStorage
     * Menyimpan maksimal 12 record riwayat terbaru
     * @param {string} name - Nama pengguna
     * @param {string} zodiacName - Nama zodiak
     */
    function saveHistory(name, zodiacName) {
      const history = JSON.parse(localStorage.getItem("zodiacHistory") || "[]");
      // Tambah record baru di awal array
      history.unshift({ name, zodiacName });
      // Simpan hanya 12 record terakhir
      localStorage.setItem("zodiacHistory", JSON.stringify(history.slice(0, 12)));
      // Update tampilan riwayat
      renderHistory();
    }

    /**
     * Fungsi untuk menampilkan daftar riwayat pencarian
     * Membaca dari localStorage dan render ke halaman
     */
    function renderHistory() {
          const history = JSON.parse(localStorage.getItem("zodiacHistory") || "[]");
          document.getElementById("historyList").innerHTML =
            history.map(h => `<li>${h.name} - ${h.zodiacName}</li>`).join("");
        }

    /**
     * Fungsi untuk menghapus semua riwayat pencarian
     * Menampilkan konfirmasi sebelum menghapus
     */
    function clearHistory() {
      if (confirm("Apakah Anda yakin ingin menghapus semua riwayat?")) {
        // Hapus data dari localStorage
        localStorage.removeItem("zodiacHistory"); 
        // Render ulang riwayat kosong
        renderHistory(); 
      }
    }

    renderHistory();
  </script>
