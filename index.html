<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Takdir Zodiak Cina</title>

  <style>
    :root {
      --blue-dark: #060b1f;
      --blue-panel: rgba(10, 20, 55, 0.78);
      --gold: #d4b36a;
      --border: rgba(200, 210, 255, 0.25);
      --text: #eef2ff;
    }

    * {
      box-sizing: border-box;
      font-family: "Georgia", "Times New Roman", serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: 
        linear-gradient(rgba(6,11,31,0.6), rgba(6,11,31,0.6)), /* 半透明叠加，保证文字可读 */
        url("images/cloud.jpg") no-repeat center center;
      background-size: cover;  
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }


    .layout {
      width: 100%;
      max-width: 960px;
      display: flex;
      gap: 24px;
    }

    .main {
      flex: 2;
    }

    .history {
      flex: 1;
      background: var(--blue-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .panel {
      background: var(--blue-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      color: #cfd6ff;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #b4933d, #f1d58a);
      color: #000;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .card {
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .zodiac-forecast {
      margin: 16px 0 18px;
      padding: 14px 16px;
      border-left: 3px solid var(--gold);
      background: rgba(255, 255, 255, 0.04);
    }

    .zodiac-forecast h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--gold);
      letter-spacing: 0.8px;
    }

    .forecast-positive {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .forecast-detail {
      font-size: 13.5px;
      line-height: 1.7;
      opacity: 0.9;
    }


    .zodiac-name {
      text-align: center;
      font-size: 22px;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .zodiac-keywords {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--gold);
      text-align: center;
    }

    .zodiac-image {
      width: 100%;         
      height: auto;        
      overflow: hidden;    
      position: relative;  
      border-radius: 0;    
      padding: 0;          
      background: none;    
      box-shadow: none;    
    }

    .zodiac-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .save-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(212, 179, 106, 0.8); 
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .save-btn:hover {
      transform: scale(1.15);
      background: rgba(212, 179, 106, 1);
    }


    .zodiac-desc {
      font-size: 14px;
      line-height: 1.8;
      text-align: justify;
    }

    .history h3 {
      margin: 0 0 12px;
      font-size: 16px;
      text-align: center;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .history ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history li {
      padding: 8px;
      border-bottom: 1px dashed rgba(255,255,255,0.15);
      font-size: 14px;
    }
    .clear-btn {
      float: right;
      font-size: 12px;
      padding: 2px 6px;
      border: none;
      border-radius: 6px;
      background: #b4933d;
      color: #000;
      cursor: pointer;
      margin-left: 8px;       
      margin-bottom: 8px;     
    }

    .clear-btn:hover {
      background: #d4b36a;
    }


    .site-footer {
      margin-top: 28px;
      padding-top: 12px;
      font-size: 12px;
      text-align: center;
      color: rgba(238, 242, 255, 0.65);
      letter-spacing: 0.6px;
      border-top: 1px dashed rgba(255,255,255,0.15);
    }

    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
      }
    }
  </style>
</head>

    function calculateZodiac() {

      const input = document.getElementById("birthDate").value;

      if (!name) { alert("Silakan masukkan nama Anda"); return; }
      if (!input) { alert("Silakan pilih tanggal lahir Anda"); return; }

      // input format: YYYY-MM-DD
      const date = new Date(input);
      if (isNaN(date)) { alert("Tanggal tidak valid"); return; }

      const lunarYear = getLunarYear(date);
      const index = (lunarYear - 4) % 12;
      const zodiac = zodiacs[index];

      document.getElementById("result").innerHTML = `
        <div class="panel card">
          <div class="zodiac-name">${name} - ${zodiac.name}</div>
          <div class="zodiac-image">
            <img src="${zodiac.image}" alt="${zodiac.name}" id="zodiacImage" />
            <button class="save-btn" onclick="saveImage('${zodiac.image}', '${name}-${zodiac.name}.jpg')">💾</button>
          </div>
          <div class="zodiac-keywords">• ${zodiac.keywords}</div>
          <div class="zodiac-forecast">
            <h3>Pandangan 2026</h3>
            <p class="forecast-positive">• ${zodiac.forecastPositive}</p>
            <p class="forecast-detail">• ${zodiac.forecast2026}</p>
          </div>
          <div class="zodiac-desc">• ${zodiac.desc}</div>
        </div>
      `;

      saveHistory(name, zodiac.name);
    }

    function saveHistory(name, zodiacName) {
      const history = JSON.parse(localStorage.getItem("zodiacHistory") || "[]");
      history.unshift({ name, zodiacName });
      localStorage.setItem("zodiacHistory", JSON.stringify(history.slice(0, 12)));
      renderHistory();
    }

    function renderHistory() {
          const history = JSON.parse(localStorage.getItem("zodiacHistory") || "[]");
          document.getElementById("historyList").innerHTML =
            history.map(h => `<li>${h.name} - ${h.zodiacName}</li>`).join("");
        }
        function clearHistory() {
      if (confirm("Apakah Anda yakin ingin menghapus semua riwayat?")) {
        localStorage.removeItem("zodiacHistory");  
        renderHistory(); 
      }
    }

    function saveImage(imageSrc, fileName) {
      const img = document.getElementById('zodiacImage');
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      canvas.toBlob(blob => {
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.95);
    }

    renderHistory();
  </script>
</body>
</html>
